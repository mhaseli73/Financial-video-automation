name: Travel Video AI Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # Runs every day at 6:00 AM UTC

permissions:
  contents: write

concurrency:
  group: travel-video-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # CRITICAL: Install video rendering tools
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # NEW: Clean up any leftover files from a previous failed run
      - name: Clean old output files
        run: |
          rm -rf output/clips
          rm -rf output/audio
          rm -f output/*.mp4

      # NEW: Run pipeline with Auto-Retry (up to 3 attempts)
      - name: Run AI pipeline
        uses: nick-invision/retry@v2
        with:
          timeout_minutes: 45
          max_attempts: 3
          retry_on: error
          command: python pipeline.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}

      - name: Save AI decision history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/decision_history.json
          if git diff --cached --quiet; then
            echo "No history changes"
          else
            git commit -m "Update AI decision history"
            git push
          fi

      - name: Save generated files
        uses: actions/upload-artifact@v4
        with:
          name: travel-video-output
          path: output/
          if-no-files-found: warn
