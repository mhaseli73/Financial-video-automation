name: Travel Video AI Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *" # Runs every day at 9:00 AM UTC (12:30 PM Iran Time)

permissions:
  contents: write

concurrency:
  group: travel-video-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install video rendering tools AND fonts for text overlays
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          
          # Auto-accept the Microsoft Font license so it installs without prompts
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get install -y ttf-mscorefonts-installer || true
          
          # FIX IMAGEMAGICK 7 SECURITY POLICY FOR TEXTCLIP
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@\*"/' /etc/ImageMagick-7/policy.xml || true
          sudo sed -i 's/rights="none" pattern="LABEL"/rights="read|write" pattern="LABEL"/' /etc/ImageMagick-7/policy.xml || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Clean up any leftover files from a previous failed run
      - name: Clean old output files
        run: |
          rm -rf output/clips
          rm -rf output/audio
          rm -f output/*.mp4

      # Run pipeline with Auto-Retry (increased timeout to 120 minutes)
      - name: Run AI pipeline
        uses: nick-invision/retry@v2
        with:
          timeout_minutes: 120
          max_attempts: 3
          retry_on: error
          command: python pipeline.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}

      - name: Save AI decision history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/decision_history.json
          if git diff --cached --quiet; then
            echo "No history changes"
          else
            git commit -m "Update AI decision history"
            git push
          fi

      - name: Save generated files
        uses: actions/upload-artifact@v4
        with:
          name: travel-video-output
          path: output/
          if-no-files-found: warn
